[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wtb2kwant"
version = "0.3.3"
description = "Converte hamiltonianos tight-binding do WanTiBEXOS em scripts Kwant"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["numpy"]

[project.optional-dependencies]
kwant = ["kwant", "matplotlib"]

[project.scripts]
wtb2kwant = "wtb2kwant.cli:main"

[tool.setuptools]
packages = ["wtb2kwant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["results", "data"]
filterwarnings = ["ignore:This process .* is multi-threaded:DeprecationWarning"]
